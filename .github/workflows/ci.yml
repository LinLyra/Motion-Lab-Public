name: CI

on:
  pull_request:
  push:
    branches: [main, framework-public]

permissions:
  contents: read

jobs:
  data-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: black --check src scripts tests research_console/server.py
      - run: ruff check src scripts tests research_console/server.py
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
